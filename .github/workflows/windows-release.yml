name: Publicar ContaClara para Windows

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Compilar, testar e publicar Windows x64
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Obter o código da versão
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Preparar Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm

      - name: Instalar dependências verificadas
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node node_modules/electron/install.js

      - name: Validar os cálculos financeiros
        run: npm test

      - name: Compilar e gerar o aplicativo portátil
        run: npm run package

      - name: Testar o aplicativo Windows e a persistência
        run: |
          $env:SALDO_EXECUTABLE = Join-Path $PWD 'release/Saldo-win32-x64/saldo.exe'
          npm run test:desktop

      - name: Preparar ZIP e checksum
        run: |
          New-Item -ItemType Directory -Force downloads | Out-Null
          @'
          CONTACLARA - Windows de 64 bits

          Extraia a pasta inteira e execute saldo.exe. Não é necessário instalar Node.js.
          Não mova apenas saldo.exe: os demais arquivos também são necessários.

          Seus dados ficam em %APPDATA%\saldo-desktop\finances.json.
          Exporte backups pelo botão de download do aplicativo para preservar uma cópia.
          '@ | Set-Content -Path release/Saldo-win32-x64/LEIA-ME.txt -Encoding utf8
          Compress-Archive -Path release/Saldo-win32-x64 -DestinationPath downloads/Saldo-Windows-x64.zip
          Copy-Item downloads/Saldo-Windows-x64.zip downloads/ContaClara-Windows-x64.zip
          $hash = (Get-FileHash downloads/Saldo-Windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Saldo-Windows-x64.zip`n$hash  ContaClara-Windows-x64.zip" | Set-Content -Path downloads/SHA256SUMS.txt -Encoding utf8

      - name: Testar atualização, retorno e preservação de dados no Windows
        run: |
          $env:SALDO_EXECUTABLE = Join-Path $PWD 'release/Saldo-win32-x64/saldo.exe'
          npm run test:updater

      - name: Publicar a versão e os arquivos para download
        if: ${{ !contains(github.ref_name, '-') || contains(github.ref_name, '-publish.') }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPO: ${{ github.repository }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $releaseTag = "v$version"
          if ($env:RELEASE_TAG -ne $releaseTag -and $env:RELEASE_TAG -notlike "$releaseTag-publish.*") {
            throw 'A tag de publicação não corresponde à versão do aplicativo.'
          }

          function Invoke-ReleaseCommand {
            param([string[]]$ReleaseArguments)
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              $output = & gh @ReleaseArguments 2>&1
              if ($LASTEXITCODE -eq 0) {
                $output | Write-Output
                return
              }
              $message = ($output | Out-String).Trim().Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::warning title=Publicação GitHub::$message"
              if ($attempt -lt 3) { Start-Sleep -Seconds 10 }
            }
            throw 'Falha ao publicar os arquivos após três tentativas; consulte as anotações acima.'
          }

          # Keep the release in draft until both verified files have been uploaded.
          $existing = & gh release view "$releaseTag" --repo "$env:RELEASE_REPO" --json tagName 2>&1
          if ($LASTEXITCODE -eq 0) {
            Invoke-ReleaseCommand -ReleaseArguments @('release', 'edit', $releaseTag, '--repo', $env:RELEASE_REPO, '--draft=true')
          } else {
            Invoke-ReleaseCommand -ReleaseArguments @('release', 'create', $releaseTag, '--repo', $env:RELEASE_REPO, '--verify-tag', '--draft', '--title', "ContaClara $releaseTag - Windows 64 bits", '--notes-file', '.github/release-notes.md')
          }
          Invoke-ReleaseCommand -ReleaseArguments @('release', 'upload', $releaseTag, 'downloads/Saldo-Windows-x64.zip', 'downloads/ContaClara-Windows-x64.zip', 'downloads/SHA256SUMS.txt', '--repo', $env:RELEASE_REPO, '--clobber')
          Invoke-ReleaseCommand -ReleaseArguments @('release', 'edit', $releaseTag, '--repo', $env:RELEASE_REPO, '--draft=false', '--latest', '--title', "ContaClara $releaseTag - Windows 64 bits", '--notes-file', '.github/release-notes.md')
